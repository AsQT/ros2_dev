reachability_scan_node:
  ros__parameters:
    # Frame and MoveIt group
    base_frame: "world"
    group_name: "arm"
    ik_link_name: "tcp_link"

    compute_ik_service: "/compute_ik"
    state_validity_service: "/check_state_validity"
    joint_state_topic: "/joint_states"
    require_joint_state_seed: true
    joint_state_wait_sec: 5.0

    # Workspace scan range, unit: meter
    x_min: 0.3
    x_max: 0.5
    y_min: -0.35
    y_max: 0.35
    z_min: 0.05
    z_max: 0.3
    xyz_step: 0.1

    # Orientation scan, unit: degree
    # roll  = rotation around X axis
    # pitch = rotation around Y axis
    # yaw is fixed unless you change yaw_deg
    roll_min_deg: -45.0
    roll_max_deg: 45.0
    pitch_min_deg: -45.0
    pitch_max_deg: 45.0
    angle_step_deg: 10.0
    yaw_deg: 0.0

    # Useful for pick/place: also check pose above target z + approach_offset_z
    check_approach: false
    approach_offset_z: 0.10

    # Validity checking
    avoid_collisions_in_ik: true
    check_state_validity: true
    ik_timeout_sec: 0.05

    # Output
    csv_path: "/tmp/reachability_map.csv"
    marker_topic: "/reachability_markers"
    marker_scale: 0.025

    # Usually false to avoid too many red markers in RViz
    publish_unreachable: false
    unreachable_stride: 1
