sensors:
  - astra_pc

astra_pc:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /camera/depth/points     # <--  theo topic của Astra
  max_range: 3.0
  point_subsample: 1
  padding_offset: 0.03
  padding_scale: 1.0
  max_update_rate: 10.0
  filtered_cloud_topic: /moveit/filtered_cloud
